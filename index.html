  <script>
    // Safety net: if anything fails while loading or running, show a reload bar instead of a dead page.
    (function () {
      var shown = false;
      function bar(message) {
        if (shown || !document.body) return; shown = true;
        var el = document.createElement('div'); el.className = 'app-error'; el.setAttribute('role', 'alert');
        el.innerHTML = '<span>' + message + '</span><button type="button">Reload</button>';
        el.querySelector('button').onclick = function () { location.reload(); };
        document.body.appendChild(el);
      }
      window.addEventListener('error', function (event) {
        var t = event.target;
        if (t && t !== window && t.tagName !== 'SCRIPT') return; // a missing image is not a broken page
        bar('Something went wrong on this page.');
      }, true);
      window.addEventListener('unhandledrejection', function () { bar('Something went wrong on this page.'); });
      window.addEventListener('load', function () {
        setTimeout(function () { var app = document.getElementById('app'); if (app && !app.children.length) bar('The demo didn’t load in this browser.'); }, 4000);
      });
    })();
  </script>
  <script type="module" src="./app.js?v=v2-1"></script>
  <script nomodule>document.addEventListener('DOMContentLoaded', function () { document.getElementById('app').innerHTML = '<p class="app-unsupported">This browser is too old for the Joe’s Landscaping demo. Update the phone’s software, or open the link in Chrome or Safari.</p>'; });</script>
